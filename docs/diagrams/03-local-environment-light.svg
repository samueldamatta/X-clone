<text x="740" y="862.5" font-size="12.5" fill="#5c5f66" text-anchor="middle">
<tspan x="740">Redpanda replaces Kafka locally: same protocol and client libraries, one binary, no ZooKeeper, a fraction of the RAM.</tspan>
<tspan x="740" dy="18.125">Production targets real Kafka — nothing in application code knows the difference.</tspan>
<tspan x="740" dy="18.125"></tspan>
<tspan x="740" dy="18.125">Every service ships traces and metrics to the collector, never straight to a backend. Swapping Jaeger for Tempo then costs one config file, not nine.</tspan>
