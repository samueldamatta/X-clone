<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="46" font-size="22" font-weight="600" fill="#1e1e1e">X-clone — Hybrid Fan-out</text>
<text x="40" y="70" font-size="13" fill="#5c5f66">Precompute the timeline for ordinary authors, compute it on read for celebrities — and merge both at request time</text>
<rect x="60" y="130" width="640" height="490" rx="12" fill="none" stroke="#adb5bd" stroke-width="1" stroke-dasharray="6 5"/>
<text x="74" y="122" font-size="13" font-weight="600" letter-spacing="0.08em" fill="#5c5f66">FAN-OUT ON WRITE — AUTHOR UNDER 10K FOLLOWERS (~99.9% OF ACCOUNTS)</text>
<rect x="780" y="130" width="640" height="490" rx="12" fill="none" stroke="#adb5bd" stroke-width="1" stroke-dasharray="6 5"/>
<text x="794" y="122" font-size="13" font-weight="600" letter-spacing="0.08em" fill="#5c5f66">NO FAN-OUT — AUTHOR OVER 10K FOLLOWERS (THE &quot;CELEBRITY PROBLEM&quot;)</text>
<rect x="60" y="720" width="1360" height="400" rx="12" fill="none" stroke="#adb5bd" stroke-width="1" stroke-dasharray="6 5"/>
<text x="74" y="712" font-size="13" font-weight="600" letter-spacing="0.08em" fill="#5c5f66">READ PATH — GET /TIMELINE/HOME</text>
