<text x="380" y="292" dy="0.35em" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#6741d9">persist + outbox row</text>
<rect x="230" y="350" width="300" height="46" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.6"/>
<text x="380" y="373" dy="0.35em" text-anchor="middle" font-size="15" font-weight="600" fill="#7a4900">Kafka · tweet.created</text>
<rect x="230" y="440" width="300" height="56" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/>
<text x="380" y="462" dy="0.35em" text-anchor="middle" font-size="15" font-weight="600" fill="#08525e">Fanout Worker</text>
<text x="380" y="482" dy="0.35em" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#0c8599">followers ≤ 10k → PUSH</text>
<rect x="230" y="540" width="300" height="64" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="1.6"/>
<text x="380" y="566" dy="0.35em" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Redis · 180 LPUSH</text>
<text x="380" y="586" dy="0.35em" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#495057">user:{follower}:home · capped 800</text>
<rect x="950" y="150" width="300" height="56" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.6"/>
<text x="1100" y="172" dy="0.35em" text-anchor="middle" font-size="15" font-weight="600" fill="#0b4a8f">@celebrity tweets</text>
<text x="1100" y="192" dy="0.35em" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#1971c2">40M followers</text>
<rect x="950" y="250" width="300" height="56" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.6"/>
<text x="1100" y="272" dy="0.35em" text-anchor="middle" font-size="15" font-weight="600" fill="#432b95">Tweet Service</text>
<text x="1100" y="292" dy="0.35em" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#6741d9">persist + outbox row</text>
<rect x="950" y="350" width="300" height="46" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.6"/>
<text x="1100" y="373" dy="0.35em" text-anchor="middle" font-size="15" font-weight="600" fill="#7a4900">Kafka · tweet.created</text>
<rect x="950" y="440" width="300" height="56" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/>
<text x="1100" y="462" dy="0.35em" text-anchor="middle" font-size="15" font-weight="600" fill="#08525e">Fanout Worker</text>
<text x="1100" y="482" dy="0.35em" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#0c8599">followers &gt; 10k → SKIP</text>
<rect x="950" y="540" width="300" height="64" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="1.6"/>
<text x="1100" y="566" dy="0.35em" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Redis · 1 LPUSH</text>
<text x="1100" y="586" dy="0.35em" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#495057">author:{id}:tweets</text>
<rect x="230" y="760" width="300" height="64" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="1.6"/>
<text x="380" y="786" dy="0.35em" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">LRANGE user:{id}:home</text>
<text x="380" y="806" dy="0.35em" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#495057">precomputed · 0..49 · ~0.2ms</text>
<rect x="950" y="760" width="300" height="64" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="1.6"/>
<text x="1100" y="786" dy="0.35em" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">LRANGE author:{c}:tweets</text>
<text x="1100" y="806" dy="0.35em" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#495057">× the 5–20 celebrities followed</text>
<rect x="545" y="890" width="390" height="64" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/>
<text x="740" y="916" dy="0.35em" text-anchor="middle" font-size="15" font-weight="600" fill="#08525e">merge-sort, take newest 50</text>
<text x="740" y="936" dy="0.35em" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#0c8599">Snowflake ID order == time order</text>
<rect x="545" y="1000" width="390" height="64" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/>
<text x="740" y="1026" dy="0.35em" text-anchor="middle" font-size="15" font-weight="600" fill="#08525e">hydrate: MGET tweet bodies</text>
<text x="740" y="1046" dy="0.35em" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#0c8599">one batch · cache-aside · IDs → objects</text>
<rect x="351.6" y="319" width="56.8" height="18" rx="5" fill="#ffffff" stroke="none"/>
<text x="380" y="328" dy="0.35em" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#5c5f66">publish</text>
<rect x="351.6" y="409" width="56.8" height="18" rx="5" fill="#ffffff" stroke="none"/>
<text x="380" y="418" dy="0.35em" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#5c5f66">consume</text>
<rect x="342" y="509" width="76" height="18" rx="5" fill="#ffffff" stroke="none"/>
<text x="380" y="518" dy="0.35em" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#e8590c">180 writes</text>
<rect x="1071.6" y="319" width="56.8" height="18" rx="5" fill="#ffffff" stroke="none"/>
<text x="1100" y="328" dy="0.35em" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#5c5f66">publish</text>
<rect x="1071.6" y="409" width="56.8" height="18" rx="5" fill="#ffffff" stroke="none"/>
<text x="1100" y="418" dy="0.35em" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#5c5f66">consume</text>
<rect x="1071.6" y="509" width="56.8" height="18" rx="5" fill="#ffffff" stroke="none"/>
<text x="1100" y="518" dy="0.35em" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#5c5f66">1 write</text>
<rect x="306.8" y="673" width="146.4" height="18" rx="5" fill="#ffffff" stroke="none"/>
<text x="380" y="682" dy="0.35em" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#e8590c">written ahead of time</text>
<rect x="1030" y="673" width="140" height="18" rx="5" fill="#ffffff" stroke="none"/>
<text x="1100" y="682" dy="0.35em" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#e8590c">read at request time</text>
<text x="740" y="417" font-size="13" fill="#e8590c" text-anchor="middle">
<tspan x="740">Same author action.</tspan>
<tspan x="740" dy="18.849999999999998">Same topic. Same worker.</tspan>
<tspan x="740" dy="18.849999999999998"></tspan>
<tspan x="740" dy="18.849999999999998">The two paths diverge on</tspan>
<tspan x="740" dy="18.849999999999998">ONE follower-count check —</tspan>
<tspan x="740" dy="18.849999999999998">and that single branch is</tspan>
<tspan x="740" dy="18.849999999999998">what stops a 40M-follower</tspan>
<tspan x="740" dy="18.849999999999998">account from issuing 40M</tspan>
<tspan x="740" dy="18.849999999999998">Redis writes per tweet.</tspan>
</text>
<text x="740" y="1152.5" font-size="12.5" fill="#5c5f66" text-anchor="middle">
<tspan x="740">Why it balances: you follow thousands of ordinary accounts but only a handful of celebrities, so the read-side merge stays small —</tspan>
<tspan x="740" dy="18.125">while celebrities are rare, so skipping their fan-out removes most of the write cost. The two asymmetries cancel out.</tspan>
<tspan x="740" dy="18.125"></tspan>
<tspan x="740" dy="18.125">What it costs: two code paths to keep consistent, and an explicit backfill when an account crosses the 10k threshold in either direction.</tspan>
</text>
</svg>
