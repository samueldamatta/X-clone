<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1240" width="1480" height="1240" role="img" aria-label="X-clone — Hybrid Fan-out" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
<marker id="ah-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
