<tspan x="800" dy="18.125">One place to reason about abuse, one place to tune.</tspan>
</text>
<text x="610" y="964.5" font-size="12.5" fill="#ff9a5c" text-anchor="middle">
<tspan x="610">The orange path is the write→read loop that defines the system. How it splits for celebrities is scene 02-hybrid-fanout.</tspan>
