name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Build first, and not because anything here needs the output. The four
      # packages in backend/libs publish their types through dist/index.d.ts,
      # so until they are built, `@x-clone/proto` and friends resolve to
      # nothing: eslint's type-aware rules see `any` and every value that came
      # from one of them trips no-unsafe-*. That was 127 errors from about ten
      # imports, on a clean checkout, while the same lint passed on a laptop
      # that happened to have a stale dist lying around. Ordering it here is
      # the cheap fix; resolving the libs from source instead (project
      # references plus tsconfig paths) would remove the ordering constraint
      # altogether, at the cost of dev and runtime resolving them differently.
      - run: pnpm build
      # One flat config at the root covers every package, so this is a single
      # eslint run rather than a recursive one.
      - run: pnpm lint
      # Vitest transpiles without type-checking, so a type error passes the
      # test run. Checking types is a separate step or it does not happen.
      - run: pnpm typecheck
      - run: pnpm test

  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          # No Go module here has a dependency yet, so no go.sum exists and the
          # glob resolved to nothing — which setup-go reports as a failed cache
          # restore on every run. Listing go.work first gives it a file that
          # exists today; go.work.sum and the per-module sums appear on their
          # own the moment Phase 3 adds a dependency, and start being hashed
          # without anyone editing this file. Turning the cache off instead
          # would have traded a warning today for a slow build later, with
          # nothing to remind anyone to turn it back on.
          cache-dependency-path: |
            go.work
            go.work.sum
            backend/services/*/go.sum
      - run: ./scripts/go-check.sh

  diagrams:
    name: diagrams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The scene specs are the source of truth; the SVGs are build output. If a
      # rebuild changes anything, someone edited a diagram without regenerating
      # it — which is exactly how README images start lying.
      - run: node docs/diagrams/_generator/build.mjs
      - run: |
          if ! git diff --quiet -- docs/diagrams; then
            echo "::error::diagrams are stale — run: node docs/diagrams/_generator/build.mjs"
            git diff --stat -- docs/diagrams
            exit 1
          fi
          echo "diagrams match their scene specs"

  environment:
    name: environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate compose
        run: docker compose -f infra/docker/compose.yml --profile full config --quiet
      # The definition of done says the phase runs from a clean `docker compose
      # up`. Asserting that in CI is the only way it stays true: it is the item
      # that rots first, and it rots silently.
      - name: bring up the core environment
        run: docker compose -f infra/docker/compose.yml up -d --wait --wait-timeout 240
      - name: smoke test
        run: ./scripts/smoke.sh
      - name: logs on failure
        if: failure()
        run: docker compose -f infra/docker/compose.yml logs --tail 60
      - name: tear down
        if: always()
        run: docker compose -f infra/docker/compose.yml down -v

  # The environment job above proves the infrastructure works. This one proves
  # the services built from this commit work *in it* — over HTTP, in containers,
  # with nothing stubbed. Day-to-day development runs these two on the host, so
  # without this job the container path would rot silently and only be
  # discovered when Phase 11 needed it.
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Built before `up`, and as its own step, so a broken Dockerfile is
      # reported as a build failure rather than as a service that never
      # became healthy.
      - name: build the application images
        run: docker compose -f infra/docker/compose.yml --profile app build
      # --wait blocks on the healthchecks, so this step failing means a service
      # never came up — and the migration container's exit code is part of that
      # chain: identity does not start until it has succeeded.
      - name: bring the environment up
        run: |
          docker compose -f infra/docker/compose.yml --profile app up -d \
            --wait --wait-timeout 300
      - name: register an account through the gateway
        run: ./scripts/integration.sh
      - name: logs on failure
        if: failure()
        run: docker compose -f infra/docker/compose.yml --profile app logs --tail 80
      - name: tear down
        if: always()
        run: docker compose -f infra/docker/compose.yml --profile app down -v
