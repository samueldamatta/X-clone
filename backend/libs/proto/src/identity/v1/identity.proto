syntax = "proto3";

package identity.v1;

// The internal contract between the Gateway and the Identity service. Loaded
// at runtime with @grpc/proto-loader — see docs/concepts/internal-grpc.md for
// why this repo does not generate TypeScript from it (yet).
service IdentityService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetProfile(GetProfileRequest) returns (Profile);
  rpc UpdateProfile(UpdateProfileRequest) returns (Profile);
}

message RegisterRequest {
  string handle = 1;
  string password = 2;
}

message RegisterResponse {
  // Snowflake id, decimal string — see docs/adr/0005-snowflake-ids.md.
  string id = 1;
  string handle = 2;
  string display_name = 3;
  // RFC 3339.
  string created_at = 4;
}

message LoginRequest {
  string handle = 1;
  string password = 2;
  // Whatever the client put in its User-Agent header, or empty. Recorded
  // on the session so a person can recognise their own logins later; the
  // server decides nothing from it.
  string user_agent = 3;
}

message LoginResponse {
  // A signed JWT. Short-lived, and verified by the Gateway with no call
  // back to this service — see docs/concepts/access-and-refresh-tokens.md.
  string access_token = 1;
  // Opaque. It means nothing to whoever holds it; only its hash is stored,
  // and it is a key into identity.sessions, which is what makes revoking
  // it possible at all.
  string refresh_token = 2;
  // Both RFC 3339, matching created_at above. Absolute instants rather
  // than "expires_in" seconds: the JWT's own exp claim is absolute, and
  // two representations of one deadline is one more than is needed. The
  // cost is that a client with a badly wrong clock refreshes at the wrong
  // moment — it still recovers, because an expired access token answers
  // 401 and the refresh path is the same either way.
  string access_token_expires_at = 3;
  string refresh_token_expires_at = 4;
  // Snowflake, decimal string. Who the caller just proved to be.
  string user_id = 5;
}

message GetProfileRequest {
  // The @name, not the id: this serves a public URL a human typed.
  string handle = 1;
}

message UpdateProfileRequest {
  // Snowflake, decimal string. It comes from the access token the Gateway
  // verified, never from the request body — which is the whole reason one
  // account cannot edit another's profile. There is no field here for
  // "whose profile", because the caller has no way to say.
  string user_id = 1;

  // `optional`, and that keyword is load-bearing.
  //
  // proto3 gives a plain `string` no field presence: an unset one and one
  // set to "" are the same bytes on the wire, and arrive identically. That
  // is fatal for a PATCH, where absent means "leave this alone" and "" means
  // "clear my bio" — two opposite instructions.
  //
  // `optional` reinstates presence (a synthetic oneof), and
  // @grpc/proto-loader preserves it: an unset field is absent from the
  // received object entirely, even under `defaults: true`. That behaviour is
  // a library guarantee this design rests on, so it is pinned by a real
  // client/server round trip in field-presence.test.ts rather than assumed.
  optional string display_name = 2;
  optional string bio = 3;
}

// Returned by both profile RPCs: a read and a write of the same thing
// should not answer in two different shapes.
message Profile {
  // Snowflake, decimal string. The stable one — a handle can be renamed,
  // this cannot, so every reference that must survive a rename points here.
  string id = 1;
  string handle = 2;
  string display_name = 3;
  // Never absent: the column defaults to '' for an account that never set one.
  string bio = 4;
  // RFC 3339.
  string created_at = 5;
}
